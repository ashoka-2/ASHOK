<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashok Kumar — Creative Developer & AI Engineer</title>
    <meta name="description" content="Award-level personal portfolio of Ashok Kumar — Software Developer, AI Enthusiast & Creative Technologist based in Kerala, India." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ashok Kumar — Creative Developer & AI Engineer" />
    <meta property="og:description" content="Turning ideas into real digital experiences. Creative development, AI engineering, interactive physics & motion." />
    <meta property="og:image" content="/og.png" />
    <meta name="theme-color" content="#0A0A0B" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 3D Avatar Preload -->
    <link rel="preload" as="fetch" href="/assets/portrait/model.glb" crossorigin />

    <!-- Google Fonts for Bricolage Grotesque, JetBrains Mono & Instrument Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Theme initialization script (prevents flash of unstyled theme) -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = savedTheme || (prefersDark ? 'dark' : 'dark'); // dark default
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-fg selection:bg-accent selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
